<div class="login-page bg-light">
  <div class="container">
    <div class="row">
      <div class="form-signin w-100 m-auto">
      <!-- <div class="col-lg-10 offset-lg-1"> -->
        <!-- <h3 class="mb-3">Recuperar senha</h3> -->
        <div class="bg-white shadow rounded">
          <div class="row">
            <div class="col-md-12 pe-0">
              <div class="form-left h-100 py-5 px-5">

                <div class="row">
                  <h3>Recuperar senha</h3>
                </div>

                <!-- FORMULARIO -->
                <form [formGroup]="recuperarForm" class="row g-4">

                  <!-- EMAIL -->
                  <div class="col-12">
                    <label>Email<span class="text-danger">*</span></label>
                    <div class="input-group">
                      <div class="input-group-text"><i class="bi bi-person-fill"></i></div>
                      <input type="text" class="form-control" formControlName="email" id="email" placeholder="Email do usuário">
                    </div>
                  </div>

                  <!-- BOTAO ENTRAR -->
                  <div class="col-sm-12">
                    <div class="d-grid gap-2">
                      <button class="btn btn-primary" 
                        type="button"
                        [disabled]="!recuperarForm.valid"
                        (click)="solicitar()">
                        Solicitar
                      </button>
                    </div>
                  </div>

                  <p class="text-center text-danger" *ngIf="mensagem?.length">
                    <strong>{{mensagem}}</strong>
                  </p>

                  <hr>

                  <p class="text-center">Voltar para <a class="text-primary" (click)="voltar()">Login</a></p>

                </form>


              </div>
            </div>
          </div>
        </div>
        <p class="text-end text-secondary mt-3">v1.0 BETA</p>
      </div>
    </div>
  </div>
</div>
