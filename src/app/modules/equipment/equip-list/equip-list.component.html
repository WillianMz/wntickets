<app-load [text]="'obtendo dados...'"></app-load>

<div class="container">
  <div class="row">
    <div class="col-12">
      <!-- TITULO DA PAGINA -->
      <div class="row mt-2 col-10">
        <h2>{{ tituloDaPagina }}</h2>
      </div>

      <form [formGroup]="filtroForm">

        <!-- TIPO/SETOR -->
        <div class="row mt-2" *ngIf="true">
          
            <div class="col-md-2 col-sm-4">
              <label>Filtrar por<span class="text-danger">*</span></label>
              <select class="form-select form-select-sm" formControlName="filtro">
                <option *ngFor="let filtro of filtros" [value]="filtro.id" (click)="filtrarPor(filtro.id)">{{ filtro.descricao }}</option>
              </select>
            </div>
    
            <div class="col-md-3 col-sm-6" *ngIf="verComboboxSetores">
              <label>Laboratórios<span class="text-danger">*</span></label>
              <select class="form-select form-select-sm" formControlName="setores">
                <option *ngFor="let setor of setores" [value]="setor.id" (click)="listar()" >{{ setor.nome }}</option>
              </select>
            </div>
    
            <div class="col-md-3 col-sm-6" *ngIf="verComboboxTipos">
              <label>Tipos<span class="text-danger">*</span></label>
              <select class="form-select form-select-sm" formControlName="tipos">
                <option *ngFor="let tipo of tiposEquipamentos" [value]="tipo.id" (click)="listar()">{{ tipo.descricao }}</option>
              </select>
            </div>
    
            <div class="col-sm-4 mt-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault" formControlName="ativo">
                <label class="form-check-label" for="flexCheckDefault">Desativados</label>
              </div>
            </div>
          
        </div>
      </form>

        <div class="col-xs-5 col-sm-10 col-lg-5">
          <div class="input-group mb-3">

              type="text"
              class="form-control form-control-sm"
              placeholder="Nome, descrição, marca, modelo, fabricante, etc..."
              [(ngModel)]="descricao"

            <button class="btn btn-sm btn-outline-secondary" type="button" (click)="buscarPorNome()">

      <!-- AVISOS -->
      <div class="row pt-2" *ngIf="!equipments?.length">
        <app-alert [mensagem]="'Nenhum resultado encontrado!'" [color]="'alert-info'"></app-alert>
      </div>

      <!-- GRID / TABELA -->
      <div class="row mt-2">
        <div class="col-12">
          <div class="columns">
            <div class="column col-12">
              <ngx-table [configuration]="configuration" [data]="equipments" [columns]="columns"> </ngx-table>
            </div>
          </div>
          <ng-template #actionTpl let-row let-rowIndex="rowIndex">
            <div class="btn-group">
              <div class="btn-group">
                <button class="btn btn-outline-success btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                  Mais detalhes
                </button>
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" type="button" (click)="editar(row.id)">Editar</a></li>
                  <li><a class="dropdown-item" type="button" (click)="ativar(row.id)" *ngIf="row.ativo == false">Ativar</a></li>
                  <li><a class="dropdown-item" type="button" (click)="desativar(row.id)" *ngIf="row.ativo == true">Desativar</a></li>
                  <li><a class="dropdown-item" type="button" (click)="excluir(row.id)">Excluir</a></li>
                  <li><a class="dropdown-item" type="button">Baixar</a></li>
                  <li><hr class="dropdown-divider"></li>
                  <li><a class="dropdown-item" type="button" >Detalhes</a></li>
                </ul>
              </div>

            </div>
          </ng-template>

      <div class="row">
        <p class="fs-6 fw-lighter">{{mensagem}}</p>
      </div>
