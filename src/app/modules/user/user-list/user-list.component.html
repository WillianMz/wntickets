<app-load [text]="'obtendo dados...'"></app-load>

<div class="container">
  <div class="row">
    <div class="col-12">

      <!-- AVISOS -->
      <div class="row pt-2" *ngIf="false">
        <app-alert [mensagem]="'Página em Desenvolvimento'" [color]="'alert-danger'"></app-alert>
      </div>

      <!-- TITULO DA PAGINA -->
      <div class="row mt-2 col-10">
        <h2>{{ tituloDaPagina }}</h2>
      </div>

      <!-- BOTOES DE ACOES -->
      <div class="row" *ngIf="true">
        <div class="col-12">
          <div class="btn-group">
            <button type="button" class="btn btn-sm btn-outline-primary" (click)="new()">
              <i class="bi bi-plus-lg"></i> Adicionar
            </button>
            <button type="button" class="btn btn-sm btn-outline-primary" (click)="saveFilter()">
              <i class="bi bi-arrow-clockwise"></i> Atualizar
            </button>
            <!-- <button type="button" class="btn btn-sm btn-outline-primary" routerLink="/users/roles">
              Tipos de Usuários
            </button> -->
          </div>
        </div>
      </div>

      <!-- GRID / TABELA -->
      <div class="row mt-2">
        <div class="col-12">
          <div class="columns">
            <div class="column col-12">
              <ngx-table [configuration]="configuration" [data]="users" [columns]="columns"> </ngx-table>
            </div>
          </div>
          <ng-template #actionTpl let-row let-rowIndex="rowIndex">
            <div class="btn-group">
              <div class="btn-group">
                <button class="btn btn-outline-success btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                  Mais detalhes
                </button>              
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" type="button" (click)="edit(row.id)">Editar</a></li>
                  <li><a class="dropdown-item" type="button" (click)="ativar(row.id)" *ngIf="!row.ativo">Ativar</a></li>
                  <li><a class="dropdown-item" type="button" (click)="desativar(row.id)" *ngIf="row.ativo">Desativar</a></li>
                  <li><a class="dropdown-item" type="button" (click)="delete(row.id)">Excluir</a></li>
                  <!-- <li><a class="dropdown-item" type="button" (click)="solicitarAtivacao(row.email)">Solicitar Cód.Ativação</a></li> -->
                  <li><a class="dropdown-item" type="button" (click)="bloquear(row.id)">Bloquear</a></li>
                  <li><a class="dropdown-item" type="button" (click)="desbloquear(row.id)">Desbloquear</a></li>
                  <li><hr class="dropdown-divider"></li>
                  <li><a class="dropdown-item" type="button">Ver Perfil</a></li>
                  <li><a class="dropdown-item" type="button" (click)="cleanFilters()">Detalhes</a></li>
                </ul>
              </div>
              
            </div>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
