<div class="container">
  <div class="row">

    <!-- AVISOS -->
    <div class="row pt-2" *ngIf="boolAviso">
      <app-alert [mensagem]="'Página em Desenvolvimento'" [color]="'alert-danger'"></app-alert>
    </div>

    <!-- NOTIFICACOES DO SERVIDOR -->
    <div class="row mt-2" *ngIf="erros?.length">
      <div class="alert alert-danger" role="alert">
        <h5>{{ message }}</h5>
        <ul *ngFor="let e of erros">
          <li><strong>{{ e.key }}</strong> - {{ e.message }}</li>
        </ul>
      </div>
    </div>

    <div class="row" *ngIf="boolTitulo">
      <h3>{{ tituloPagina }}</h3>
    </div>

    <!-- Dados do ticket -->
    <div class="col-12">
      <form [formGroup]="ticketForm">
        <div class="row g-3">

          <!-- SETOR -->
          <div class="col-sm-6">
            <label for="lastName" class="form-label">Setor</label>
            <select class="form-select" id="setor" formControlName="setor" required="">
              <option (click)="loadCategories()" [value]="s.id" *ngFor="let s of sectors">{{ s.nome }}</option>
            </select>

            <div class="invalid-feedback">
              Please select a valid country.
            </div>
          </div>

          <!-- CATEGORIA -->
          <div class="col-sm-6">
            <label for="lastName" class="form-label">Categoria</label>
            <select class="form-select" id="categoria" formControlName="categoria" required="">
              <option value="{{c.Id}}" *ngFor="let c of categories">{{c.Nome}}</option>
            </select>
            <div class="invalid-feedback">
              Please select a valid country.
            </div>
          </div>

          <!-- STATUS -->
          <div class="col-sm-4" *ngIf="selectStatus">
            <label for="lastName" class="form-label">Status</label>
            <select class="form-select" required="" id="status" formControlName="status">
              <option value="">Selecione...</option>
              <option>Option 1</option>
            </select>
            <div class="invalid-feedback">
              Please select a valid country.
            </div>
          </div>

          <!-- PRIORIDADE -->
          <div class="col-sm-4" *ngIf="selectPriority">
            <label for="lastName" class="form-label">Prioridade</label>
            <select class="form-select" required="" id="prioridade" formControlName="prioridade">
              <option value="">Selecione...</option>
              <option>Option 1</option>
            </select>
            <div class="invalid-feedback">
              Please select a valid country.
            </div>
          </div>

          <!-- ASSUNTO -->
          <div class="col-12" *ngIf="boolAss">
            <label>Assunto</label>
            <input type="text" class="form-control" id="assunto" formControlName="assunto"  placeholder="Assunto">

            <!-- VALIDACAO -->
            <!-- <div class="text-danger" *ngIf="assunto?.errors">
              <div *ngIf="assunto?.errors?.required && (assunto?.dirty || assunto?.touched)">Informe assunto do chamado</div>
              <div *ngIf="assunto?.errors?.minlength && (assunto?.dirty || assunto?.touched)">
                O assunto deve conter no mínimo {{ assunto?.errors?.minlength.requiredLength }} caracteres
              </div>
              <div *ngIf="assunto?.errors?.maxlength && (assunto?.dirty || assunto?.touched)">
                O assunto deve conter no máximo {{ assunto?.errors?.maxlength.requiredLength }} caracteres</div>
            </div> -->
          </div>

          <!-- DESCRICAO DO PROBLEMA -->
          <div class="col-12">
            <label for="username" class="form-label">Descrição do problema</label>
            <div class="input-group ">
              <!-- <span class="input-group-text">@</span> -->
              <textarea type="text" class="form-control" id="descricao" formControlName="descricao" placeholder="Descrição do problema"
                required=""></textarea>
              <div class="invalid-feedback">
                Your username is required.
              </div>

              <!-- VALIDACAO -->
              <!-- <div class="text-danger" *ngIf="descricao?.errors">
                <div *ngIf="descricao?.errors?.required && (descricao?.dirty || descricao?.touched)">Informe a descrição do problema</div>
                <div *ngIf="descricao?.errors?.minlength && (descricao?.dirty || descricao?.touched)">
                  A descrição deve conter no mínimo {{ descricao?.errors?.minlength.requiredLength }} caracteres
                </div>
                <div *ngIf="descricao?.errors?.maxlength && (descricao?.dirty || descricao?.touched)">
                  A descrição deve conter no máximo {{ descricao?.errors?.maxlength.requiredLength }} caracteres</div>
              </div> -->
            </div>
          </div>

        </div>
        <!-- <hr class="my-4"> -->
      </form>

      <div class="row mt-2">
        <div class="col">
          <div class="btn-group">
            <button class="btn sm btn-outline-primary">
              <i class="bi bi-paperclip"></i>
              Anexar arquivo
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- anexos -->
    <app-ticket-attachments></app-ticket-attachments>
    
    <div class="row mt-2">
      <div class="col">
        <div class="btn-group">
          <button type="button" class="btn btn-outline-danger" [routerLink]="['/ticket']">Cancelar</button>
          <button class="btn sm btn-outline-primary"><i class="bi bi-check"></i>Salvar</button>
          <!-- <button type="button" class="btn btn-outline-primary" [disabled]="!equipForm.valid" (click)="salvar()">Salvar</button> -->
        </div>
      </div>
    </div>

  </div>
</div>
