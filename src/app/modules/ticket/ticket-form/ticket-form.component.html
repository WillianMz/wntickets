<div class="container">
  <section class="pt-2 row">
    <h2 class="col-12 mb-3">TRAZER ASSUNTO</h2>
  </section>

  <div class="row g-5">

    <div class="col-md-7 col-lg-8">
      <form [formGroup]="ticketForm">
        <div class="row g-3">

          <!-- DESCRICAO DO PROBLEMA -->
          <div class="col-12">
            <label class="form-label">Descrição</label>
            <div class="input-group">
              <textarea type="text" class="form-control" formControlName="descricao" placeholder="Descrição do problema"
                value="" required=""></textarea>
            </div>
          </div>

          <!-- DATA ABERTURA -->
          <div class="col-sm-3">
            <label class="form-label">Data abertura</label>
            <input type="text" class="form-control" formControlName="dataAbertura" placeholder="09/12/2021"
              value="" required="">
          </div>

          <!-- CRIADOR DO TICKET -->
          <div class="col-sm-3">
            <label class="form-label">Criado por</label>
            <input type="text" class="form-control" formControlName="criador" placeholder="Criador"
              value="" required="">
          </div>

          <!-- STATUS -->
          <div class="col-sm-3">
            <label for="status" class="form-label">Status</label>
            <input type="text" class="form-control" formControlName="status" placeholder="Status"
              required="">

            <!-- FAZER COM SELECT PARA CASOS DE EDIÇÃO -->

            <!-- <select class="form-select campo-obrigatorio" formControlName="status" placeholder="Status" required="">
              <option selected>Selecione o status desejado</option>
              <option value="1">Novo</option>
              <option value="2">Pendente</option>
              <option value="3">EmAtendimento</option>
              <option value="4">Finalizado</option>
              <option value="5">Cancelado</option>
              <option value="6">Fechado</option>
              <option value="7">Reaberto</option>
            </select> -->
          </div>

          <!-- PRIORIDADE -->
          <div class="col-sm-3">
            <label for="prioridade" class="form-label">Prioridade</label>
            <input type="text" class="form-control" formControlName="prioridade" placeholder="Prioridade"
              required="">

            <!-- FAZER COM SELECT PARA CASOS DE EDIÇÃO -->

            <!-- <select class="form-select campo-obrigatorio" formControlName="prioridade" placeholder="Prioridade" required="">
              <option selected>Selecione a prioridade desejada</option>
              <option value="1">Baixa</option>
              <option value="2">Normal</option>
              <option value="3">Alta</option>
              <option value="4">Urgente</option>
            </select> -->
          </div>


          <!-- SETOR -->
          <div class="col-sm-5">
            <label>Laboratório<!-- <span class="text-danger">*</span> --></label>
            <select class="form-select campo-obrigatorio" formControlName="setor" placeholder="Setor"
              required="">
              <option *ngFor="let setor of setores" [value]="setor.id">{{ setor.nome }}</option>
            </select>
          </div>

          <!-- DATA FECHAMENTO -->
          <div class="col-sm-3">
            <label class="form-label">Data fechamento</label>
            <input type="text" class="form-control" formControlName="dataFechamento" readonly>
          </div>

          <!-- SOLUÇÃO DO PROBLEMA -->
          <div class="col-sm-12">
            <label class="form-label">Solução aplicada</label>
            <input type="text" class="form-control" formControlName="solucao" placeholder="Solucao aplicada"
              value="" required="">
          </div>

        </div>
        <hr class="my-4">
      </form>

      <div class="row mt-2">
        <div class="col">
          <div class="btn-group">
            <button type="button" class="btn btn-outline-danger" [routerLink]="['/ticket']">Cancelar</button>
            <button type="button" class="btn btn-outline-primary" [disabled]="!ticketForm.valid"
              (click)="salvar()">Salvar</button>
          </div>
        </div>
      </div>

    </div>

    <div class="col-md-5 col-lg-4 order-md-last">
      <ul class="list-group mb-3">
        <li class="list-group-item">
          <div>
            <button class="w-100 btn btn-outline-primary btn-lg" type="submit" (click)="newTicket()">Novo Chamado</button>
          </div>
        </li>
        <li class="list-group-item">
          <div>
            <button class="w-100 btn btn-outline-secondary btn-lg" type="submit" (click)="goAttachments()">Anexos</button>
          </div>
        </li>
        <li class="list-group-item">
          <div>
            <button type="button" class="w-100 btn btn-outline-danger btn-lg" data-bs-toggle="modal" data-bs-target="#staticBackdrop_1">
              Cancelar Chamado
            </button>
          </div>
        </li>

        <li class="list-group-item">
          <div>
            <button type="button" class="w-100 btn btn-outline-success btn-lg" data-bs-toggle="modal" data-bs-target="#staticBackdrop_2">
              Finalizar Chamado
            </button>
          </div>
        </li>

      </ul>
    </div>

      <!-- Modal Cancelar -->
      <div class="modal fade" id="staticBackdrop_1" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="staticBackdropLabel">Cancelar o Ticket</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <label>Motivo</label>
              <input type="text" class="form-control" placeholder="Motivo"> <!-- TRATAR INFORMAÇÃO DIGITADA -->
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-danger" data-bs-dismiss="modal">Fechar</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" type="submit" (click)="cancelarTickets.fire()">Cancelar Ticket</button>
            </div>

            <swal
                #cancelarTickets 
                title="Tem certeza que deseja cancelar o ticket?"
                text="Esta ação não poderá ser desfeita"
                icon="question"
                [showCancelButton]="true"
                [focusCancel]="true"
                (confirm)="cancelarTicket()">
            </swal>

          </div>
        </div>
      </div>

      <!-- Modal Finalizar -->
      <div class="modal fade" id="staticBackdrop_2" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="staticBackdropLabel">Finalizar o Ticket</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <label>Solução</label>
              <input type="text" class="form-control" placeholder="Solução"> <!-- TRATAR INFORMAÇÃO DIGITADA -->
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-danger" data-bs-dismiss="modal">Cancelar</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" type="submit" (click)="finalizarTickets.fire()">Finalizar Ticket</button>
            </div>

            <swal
              #finalizarTickets
              title="Tem certeza que deseja finalizar o ticket?"
              text="Esta ação não poderá ser desfeita"
              icon="question"
              [showCancelButton]="true"
              [focusCancel]="true"
              (confirm)="finalizarTicket()">
            </swal>

          </div>
        </div>
      </div>

  </div>
</div>
