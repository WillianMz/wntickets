<main class="container-fluid mt-2">
    <!-- <h1 class="mt-4">Dashboard</h1>
    <ol class="breadcrumb mb-4">
      <li class="breadcrumb-item active">Olá suporte</li>
    </ol> -->  

    <div class="col-md-12">
      <div class="breadcrumb">
        <a class="breadcrumb-item" href="/">Home</a>
        <a class="breadcrumb-item" href="https://onibusbrasil.com/modelos">Dashboard</a>
        <!-- <a class="breadcrumb-item" href="https://onibusbrasil.com/modelos/carroceria">Carrocerias</a>
        <a class="breadcrumb-item" href="https://onibusbrasil.com/modelos/carroceria/marcopolo">Marcopolo</a>
        <a class="breadcrumb-item active" href="https://onibusbrasil.com/modelos/carroceria/marcopolo/paradiso-g7-1800-dd">
          Paradiso G7 1800 DD
        </a> -->
      </div>      
    </div>

    <div class="row">

      <!-- MEUS TICKETS -->
      <div class="col-xl-3 col-md-6">
        <div class="card bg-primary text-white mb-4">
          <div class="card-body">
            Meus Tickets

            <div class="text-end">
              <h1>6</h1>
            </div>

          </div>
          <div class="card-footer d-flex align-items-center justify-content-between">
            <a class="small text-white stretched-link" href="#">Ver detalhes</a>
            <div class="small text-white"><i class="fas fa-angle-right"></i></div>
          </div>
        </div>
      </div>

      <!-- PRIORIDADE FINALIZADOS -->
      <div class="col-xl-3 col-md-6">
        <div class="card bg-success text-white mb-4">
          <div class="card-body">
            Tickets finalizados

            <div class="text-end">
              <h1>09</h1>
            </div>

          </div>
          <div class="card-footer d-flex align-items-center justify-content-between">
            <a class="small text-white stretched-link" href="#">Ver detalhes</a>
            <div class="small text-white"><i class="fas fa-angle-right"></i></div>
          </div>
        </div>
      </div>

      <!-- CARD ALTO -->
      <div class="col-xl-3 col-md-6">
        <div class="card bg-warning text-white mb-4">
          <div class="card-body">
            Tickets Pendentes

            <div class="text-end">
              <h1>10</h1>
            </div>

          </div>
          <div class="card-footer d-flex align-items-center justify-content-between">
            <a class="small text-white stretched-link" href="#">Ver detalhes</a>
            <div class="small text-white"><i class="fas fa-angle-right"></i></div>
          </div>
        </div>
      </div>

      <!-- PRIORIDADE URGENTE -->
      <div class="col-xl-3 col-md-6">
        <div class="card bg-danger text-white mb-4">
          <div class="card-body">
            Tickets Urgentes

            <div class="text-end">
              <h1>4</h1>
            </div>

          </div>
          <div class="card-footer d-flex align-items-center justify-content-between">
            <a class="small text-white stretched-link" href="#">Ver detalhes</a>
            <div class="small text-white"><i class="fas fa-angle-right"></i></div>
          </div>
        </div>
      </div>

    </div>

    <div class="card mb-4">
      <div class="card-header">
        <i class="fas fa-table me-1"></i>
        Total de Tickets
      </div>
      <div class="card-body">
        <app-alert [mensagem]="'Recurso em desenvolvimento!'" [color]="'alert-secondary'"></app-alert>
      </div>
    </div>

    <div class="row" *ngIf="false">
      <div class="col-xl-6">
        <div class="card mb-4">
          <div class="card-header">
            <i class="fas fa-chart-area me-1"></i>
            Top 5 Setores
          </div>
          <div class="card-body">
            <!-- <canvas id="myAreaChart" width="100%" height="40"></canvas> -->
            <app-alert [mensagem]="'Recurso em desenvolvimento!'" [color]="'alert-secondary'"></app-alert>
          </div>
        </div>
      </div>
      <div class="col-xl-6">
        <div class="card mb-4">
          <div class="card-header">
            <i class="fas fa-chart-bar me-1"></i>
            Top 5 Usuários
          </div>
          <div class="card-body">
            <app-alert [mensagem]="'Recurso em desenvolvimento!'" [color]="'alert-secondary'"></app-alert>
          </div>
        </div>
      </div>
    </div>
</main>
