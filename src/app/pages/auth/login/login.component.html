<div class="bg-dark">

  <div class="container col-xl-10 col-xxl-8 px-4">
    <div class="row align-items-center g-lg-5 py-5">

      <div class="col-lg-7 text-center text-lg-start  text-white">
        <h1 class="display-4 fw-bold lh-1 mb-3">WN Tickets</h1>
        <p class="col-lg-10 fs-4">
          Bem vindo ao WNTickets. Um sistema para gerenciamento de bugs de software e solicitação de chamados de TI.
        </p>

        <br>
        <br>
        <div class="text">
          <h4>WILLIAN</h4>
        </div>
      </div>

      <div class="col-md-10 mx-auto col-lg-5">
        <form class="p-4 p-md-5 border rounded-3 bg-light">

          <h1 class="h3 mb-3 fw-normal">Entrar</h1>

          <div class="form-floating mb-3">
            <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
            <label for="floatingInput">Email</label>
          </div>

          <div class="form-floating mb-3">
            <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
            <label for="floatingPassword">Senha</label>
          </div>

          <div class="checkbox mb-3">
            <label>
              <input type="checkbox" value="remember-me"> Lembrar-me
            </label>
          </div>

          <button class="w-100 btn btn-lg btn-primary" routerLink="/home">Entrar</button>
          <hr class="my-4">

          <small class="text-muted">Não tem uma conta? </small>
            <a routerLink="/auth/register">Crie uma!</a>
          <br>
          <small class="text-muted">Esqueceu a senha? </small><a routerLink="/auth/recover">Recuperar minha conta!</a>
          <br>
          <small class="text-muted">Ativar usuário? </small><a routerLink="/auth/activate">Ativar conta de usuário!</a>
        </form>
      </div>
    </div>
  </div>
</div>
