</div>

<div class="container">
  <div class="col-md-10 mx-auto col-lg-5 pt-5">
    <form class="p-4 p-md-5 border rounded-3 bg-light">

      <h1 class="h3 mb-3 fw-normal">Ativar Usuário</h1>

      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">

      <div class="form-floating mb-3">

      </div>

      <button class="w-100 btn btn-lg btn-primary" routerLink="/auth">Prosseguir</button>
