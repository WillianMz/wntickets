<div class="sticky-top ">
  <app-navbar></app-navbar>
</div>

<div class="container">
  <div class="row pt-2" *ngIf="true">
    <app-alert-nada-exibir [mensagem]="'EM DESENVOLVIMENTO'" [color]="'alert-danger'"></app-alert-nada-exibir>
  </div>
</div>

<ng-template #filtroPesquisa>
  <div class="modal-header">
    <h4 class="modal-title pull-left">Filtros</h4>
    <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="modalRef?.hide()">
      <span aria-hidden="true" class="visually-hidden">&times;</span>
    </button>
  </div>
  <div class="modal-body">

    <ul class="list-group">
      <label class="list-group-item">
        <input class="form-check-input me-1" type="checkbox" value="true" [(ngModel)]="categoryDisabled">
        Categorias desativados
      </label>
    </ul>

    <div class="row mt-2">
      <button class="btn btn-primary" (click)="filter()">Aplicar</button>
    </div>

  </div>
</ng-template>

<div class="container">

  <div class="row mt-2">
    <div class="col-12">
      <h2>{{titlePage}}</h2>
    </div>
  </div>

  <div class="row mt-2">
    <div class="col-xs-6 col-sm-12 col-lg-6">
      <div class="input-group mb-3">
        <input type="text" class="form-control" placeholder="Pesquisar por" aria-label="Recipient's username"
          aria-describedby="button-addon2">
        <button class="btn btn-outline-secondary" type="button" id="button-addon2">
          <i class="bi bi-search"></i> Procurar
        </button>
      </div>
    </div>
  </div>

  <div class="row" *ngIf="true">
    <div class="col-12">
      <div class="col-xs-6 col-sm-12 col-lg-6">
        <div class="btn-group">
          <button type="button" class="btn btn-outline-primary" (click)="new()">
            <i class="bi bi-plus-square"></i> Adicionar
          </button>
          <button type="button" class="btn btn-outline-primary" (click)="listAll()">
            <i class="bi bi-arrow-clockwise"></i> Atualizar
          </button>
          <button type="button" class="btn btn-outline-primary" (click)="alert()">
            <i class="bi bi-check2-square"></i> Selecionar
          </button>
          <button type="button" class="btn btn-outline-primary" (click)="alert()">
            <i class="bi bi-printer"></i> Imprimir
          </button>
          <button type="button" class="btn btn-outline-primary" (click)="openModal(filtroPesquisa)">
            <i class="bi bi-filter"></i> Filtros
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="row mt-2" *ngIf="categories?.length">
    <div class="col-12">
      <ngx-table [data]="categories" [configuration]="configuration" [columns]="columns">
        <ng-template let-row>
          <td>
            <div class="font-small">{{ row.id }}</div>
          </td>
          <td>
            <span class="font-small">{{ row.nome }}</span>
          </td>
          <td>
            <span class="font-small">{{ row.sectorName || "NÃO DISPONÍVEL!"}}</span>
          </td>
          <td>
            <div class="btn-group">
              <button class="btn btn-outline-warning btn-sm" tooltip="Editar" (click)="edit(row.id)">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-outline-danger btn-sm" tooltip="Excluír" (click)="delete(row.id)">
                <i class="bi bi-trash"></i>
              </button>
              <button class="btn btn-outline-success btn-sm" tooltip="Ativar categoria" (click)="enable(row.id)"
                *ngIf="row.ativa == false">
                <i class="bi bi-toggle2-on"></i>
              </button>
              <button class="btn btn-outline-secondary btn-sm" tooltip="Desativar categoria" (click)="disable(row.id)"
                *ngIf="row.ativa == true">
                <i class="bi bi-toggle2-off"></i>
              </button>
            </div>
          </td>
        </ng-template>
      </ngx-table>
    </div>
  </div>

  <div class="row pt-2" *ngIf="!categories?.length">
    <app-alert-nada-exibir [mensagem]="'Nenhum setor encontrado!'" [color]="'alert-secondary'"></app-alert-nada-exibir>
  </div>

</div>
