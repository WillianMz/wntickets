<div class="container">

  <section class="row">
    <h3 class="col-12 mb-3" >{{titlePagina}}</h3>
  </section>

  <div class="row">
    <div class="col">
      <div class="btn-group">
        <button type="button" class="btn btn-outline-primary" (click)="openModal(createNewCategory)">Adicionar</button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-sm-12 col-md-6 col-lg-2 pt-2">
      <form class="text-center">
        <div class="form-group">
          <select class="form-select" aria-label="Default select example">
            <option selected>Por Setor</option>
            <option value="2">Que contenha</option>
          </select>
        </div>
      </form>
    </div>

    <div class="col-sm-12 col-md-6 col-lg-6 pt-2">
      <form class="text-center">
        <div class="form-group">
          <input class="form-control" placeholder="Pesquisar">
        </div>
      </form>
    </div>

    <div class="col-sm-12 col-md-12 col-lg-4 pt-2 d-grid">
      <button class="btn btn-primary">Buscar</button>
    </div>
  </div>

  <hr>

  <div class="pt-2 row">
    <div class="col-12">
      <div class="list-group">

        <div class="list-group-item list-group-item-action d-flex gap-3 py-3" *ngFor="let cat of categories | paginate: { itemsPerPage: contador, currentPage: pag }">

          <img src="{{cat.img || '../../../../../../assets/logo.png'}}" alt="" width="32" height="32" class="rounded-circle flex-shrink-o">
          <div class="d-flex gap-2 w-100 justify-content-between">
            <a class="link" [routerLink]="['/sectors/categories']" [queryParams]="{sector: cat.id}">
              <h6 class="mb-0">{{cat.nome}}</h6>
            </a>

            <div class="btn-group btn-group-sm">
              <button class="btn btn-sm btn-outline-warning" [routerLink]="['edit', cat.id]">
                <i class="bi bi-pencil-square"></i> Editar
              </button>
              <button class="btn btn-sm btn-outline-danger" [routerLink]="['edit', cat.id]">
                <i class="bi bi-x-square"></i> Excluír
              </button>
            </div>
          </div>
        </div>
      </div>

      <app-alert-nada-exibir *ngIf="!categories?.length"></app-alert-nada-exibir>

    </div>
  </div>

  <div class="text-center pt-2">
    <pagination-controls
      (pageChange)="pag = $event"
      [responsive]="true"
      [autoHide]="true"
      previousLabel="Voltar"
      nextLabel="Avançar">
    </pagination-controls>
  </div>

  <!-- <div class="alert alert-secondary" role="alert">
    Nenhum registro encontrado!
  </div> -->



</div>

<ng-template #createNewCategory>
  <div class="modal-header">
    <h4 class="modal-title pull-left">Nova categoria</h4>
    <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="modalRef?.hide()">
      <span aria-hidden="true" class="visually-hidden">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <app-sector-form></app-sector-form>
  </div>
</ng-template>
