<app-navbar></app-navbar>

<div class="container">

  <section class="row">
    <h1 class="col-12 mb-3" style="font-size: 3em;">Setores</h1>
  </section>

  <div class="row">
    <div class="col">
      <div class="btn-group">
        <button type="button" class="btn btn-outline-primary" (click)="openModal(createNewSector)">Adicionar</button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-sm-12 col-md-6 col-lg-2 pt-2">
      <form class="text-center">
        <div class="form-group">
          <select class="form-select" aria-label="Default select example">
            <option selected>Procurar por</option>
            <option value="2">Que contenha</option>
          </select>
        </div>
      </form>
    </div>

    <div class="col-sm-12 col-md-6 col-lg-6 pt-2">
      <form class="text-center">
        <div class="form-group">
          <input class="form-control" placeholder="Pesquisar">
        </div>
      </form>
    </div>

    <div class="col-sm-12 col-md-12 col-lg-4 pt-2 d-grid">
      <button class="btn btn-primary">Buscar</button>
    </div>
  </div>

  <hr>

  <div class="pt-2 row">
    <div class="col-12">
      <div class="list-group">
        <div class="list-group list-group-item-action d-lex gap-3 py-3">

        </div>

        <a class="list-group-item list-group-item-action d-flex gap-3 py-3"
           *ngFor="let s of sectors | paginate: { itemsPerPage: contador, currentPage: pag }"
           [routerLink]="['edit',s.id]">
          <img src="https://github.com/twbs.png" alt="" width="32" height="32" class="rounded-circle flex-shrink-o">

          <div class="d-flex gap-2 w-100 justify-content-between">
            <div>
              <h6 class="mb-0">{{s.nome}}</h6>
            </div>
            <!-- <small class="opacity-50 text-nowrap">{{s.ativo}}</small> -->
            <div class="btn-group">
              <button class="btn btn-warning btn-sm">
                <i class="bi bi-pencil-square"></i>
              </button>
              <button class="btn btn-danger btn-sm">
                <i class="bi bi-x-square"></i>
              </button>
            </div>
          </div>
        </a>
      </div>
    </div>
  </div>

  <div class="text-center pt-2">
    <pagination-controls
      (pageChange)="pag = $event"
      [responsive]="true"
      [autoHide]="true"
      previousLabel="Voltar"
      nextLabel="Avançar">
    </pagination-controls>
  </div>

<ng-template #createNewSector>
  <div class="modal-header">
    <h4 class="modal-title pull-left">Novo Setor</h4>
    <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="modalRef?.hide()">
      <span aria-hidden="true" class="visually-hidden">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <app-sector-form></app-sector-form>
  </div>
</ng-template>
