<div class="container">

  <div class="pt-2 row">
    <h2>Tickets</h2>
  </div>

  <div class="pt-2 row">
    <div class="row">
      <div class="col-sm-12 col-md-6 col-lg-3 pt-1">
        <form class="text-center">
          <div class="form-group">
            <select class="form-select" aria-label="Default select example">
              <option selected>SETOR</option>
              <option value="1">Programação</option>
            </select>
          </div>
        </form>
      </div>

      <div class="col-sm-12 col-md-6 col-lg-3 pt-1">
        <form class="text-center">
          <div class="form-group">
            <select class="form-select" aria-label="Default select example">
              <option selected>CATEGORIA</option>
              <option value="1">Teste de Software</option>
            </select>
          </div>
        </form>
      </div>

      <div class="col-sm-12 col-md-6 col-lg-3 pt-1">
        <form class="text-center">
          <div class="form-group">
            <select class="form-select" aria-label="Default select example">
              <option selected>PRIORIDADE</option>
              <option value="1">Baixa</option>
              <option value="2">Normal </option>
              <option value="3">Alta</option>
              <option value="4">Urgente</option>
            </select>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="pt-2 row">
    <div>
      <tabset>
        <tab heading="Pendentes" id="tab1">

          <div class="row">
            <div class="col-sm-12 col-md-6 col-lg-2 pt-2">
              <form class="text-center">
                <div class="form-group">
                  <select class="form-select" aria-label="Default select example">
                    <option selected>Procurar por</option>
                    <option value="1">Cliente</option>
                    <option value="2">Que contenha</option>
                  </select>
                </div>
              </form>
            </div>

            <div class="col-sm-12 col-md-6 col-lg-6 pt-2">
              <form class="text-center">
                <div class="form-group">
                  <input class="form-control" placeholder="Pesquisar">
                </div>
              </form>
            </div>

            <div class="col-sm-12 col-md-12 col-lg-4 pt-2 d-grid">
              <button class="btn btn-primary">Buscar</button>
            </div>
          </div>

          <div class="pt-2 row" *ngIf="true">
            <app-alert-nada-exibir mensagem="Ótimo! Nenhum ticket pendente." color="alert-success"></app-alert-nada-exibir>
          </div>
        </tab>
        <tab heading="Finalizados">
          <div class="pt-2 row" *ngIf="true">
            <app-alert-nada-exibir mensagem="Nenhum ticket finalizado!" color="alert-secondary"></app-alert-nada-exibir>
          </div>
        </tab>
        <tab heading="Cancelados">
          <div class="pt-2 row" *ngIf="true">
            <app-alert-nada-exibir mensagem="Nenhum ticket cancelado!" color="alert-warning"></app-alert-nada-exibir>
          </div>
        </tab>
      </tabset>
    </div>
  </div>
</div>
